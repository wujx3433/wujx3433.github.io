name: 每日自动更新音游成绩
# 触发规则：UTC 0点 执行 + 支持手动触发
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# 🔥 核心修复：给Action开启仓库写入权限
permissions:
  contents: write

jobs:
  update-score:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码 + 子模块（带权限令牌）
      - name: Checkout code & submodules
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }} # 🔥 修复点

      # 2. 安装Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安装依赖
      - name: Install dependencies
        run: pip install requests

      # 4. 运行脚本生成成绩
      - name: Run score scripts
        env:
          LX_API: ${{ secrets.LX_API }}
          MAI_USER_ID: ${{ secrets.MAI_USER_ID }}
          CHUNI_USER_ID: ${{ secrets.CHUNI_USER_ID }}
        run: |
          cd modules/lx-score
          python mai.py
          python chuni.py

      # 5. 提交并推送（修复权限）
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add public/*.txt
          git diff --quiet || git commit -m "✨ 自动更新每日音游成绩"
          git push